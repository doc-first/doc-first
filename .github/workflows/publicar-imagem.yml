# Publica a imagem do Doc First no GitHub Container Registry.
#
# ⚠️ Só roda quando você manda (workflow_dispatch). Publicar imagem é criar algo que outras pessoas
# vão baixar — não é coisa que deva acontecer sozinha a cada push enquanto o projeto é novo.
# Quando estabilizar, acrescente `push: tags: ['v*']` aqui e publique por tag de versão.
#
# Depois da primeira publicação, o pacote nasce PRIVADO. Para que outro repositório consiga
# `docker pull` sem credencial — o caso do CI do Arautos —, torne o pacote público em:
#   github.com/users/Garbiati/packages/container/doc-first/settings
name: Publicar imagem

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da imagem (ex.: 0.1.0). Também sai como :latest'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write          # o mínimo: escrever no registry, nada mais

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Antes de publicar, prove. Uma imagem quebrada no registry é pior que nenhuma imagem: quem
      # baixar vai achar que o problema é dele.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Os testes passam?
        run: npm test

      - name: O bundle do painel está em dia?
        run: |
          npm run build:web
          if ! git diff --quiet review/web/painel-react.js; then
            echo "✗ review/web/painel-react.js está desatualizado."
            echo "  Rode e commite:  npm run build:web"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/doc-first:${{ inputs.versao }} \
                       -t ghcr.io/${{ github.repository_owner }}/doc-first:latest .

      # A imagem sobe e serve? É a mesma prova que o ensaio do Arautos faz, e pelo mesmo motivo:
      # "o build passou" nunca foi "o serviço funciona".
      - name: A imagem sobe e responde?
        run: |
          docker run -d --name prova -p 8080:8080 -v prova:/dados \
            -e REVISAO_OWNER=prova@exemplo.org \
            ghcr.io/${{ github.repository_owner }}/doc-first:latest
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/saude || true)" = 200 ] && break
            sleep 1
          done
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/saude)
          [ "$codigo" = 200 ] || { echo "✗ a imagem não respondeu (HTTP $codigo)"; docker logs prova; exit 1; }
          echo "✓ a imagem sobe e responde"
          docker rm -f prova

      - name: Publicar
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/doc-first:${{ inputs.versao }}
          docker push ghcr.io/${{ github.repository_owner }}/doc-first:latest
          echo "publicado: ghcr.io/${{ github.repository_owner }}/doc-first:${{ inputs.versao }}"
