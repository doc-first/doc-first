name: Something is broken
description: The tool did something other than what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if an approval turned yellow or red and you did not expect it, that may be
        the tool working. Yellow means the text changed after the ✓; red means something the block
        depends on changed. Both are the lock doing its job.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        I ran `doc-first conferir` and it reported a block as changed.
        The file has not been edited since the approval.
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: The smallest way to reproduce it
      description: A page with two blocks beats a repository with two hundred.
      render: shell
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, or the commit you are on
      placeholder: "ghcr.io/doc-first/doc-first:0.1.0"
    validations: { required: true }

  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options: [docker compose, docker run, node directly, something else]
    validations: { required: true }

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The lines around the failure. Remove anything private first.
      render: shell
