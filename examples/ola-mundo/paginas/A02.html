<main class="doc-pagina">

  <h1 class="doc-titulo"><span class="doc-titulo__cod">A02</span> Uma segunda página</h1>

  <p class="frase" data-id="A02.1.1" data-cod="1.1">
    Existe para provar que o motor lida com mais de uma folha, e que os códigos não colidem.
  </p>

  <div class="bloco" data-id="A02.1.2" data-cod="1.2">
    <p>O código de cada trecho começa com o código da página. É assim que o motor sabe a que folha
    um evento pertence sem precisar guardar o caminho do arquivo.</p>
  </div>

</main>

<!-- O painel de revisão. A ordem importa: common.js define window.ARAUTOS, que os outros usam.
     review.js é script clássico de propósito — ele monta os botões antes do primeiro paint.
     core-web.js é módulo, e por isso chega em paralelo sem bloquear. -->
<script src="/review/web/common.js"></script>
<script src="/review/web/review.js"></script>
<script type="module" src="/review/web/core-web.js"></script>
</body>
