  <p class="frase" data-id="A02.1.1" data-cod="1.1">
    It exists to prove the engine handles more than one sheet, and that the codes do not collide.
  </p>

  <div class="bloco" data-id="A02.1.2" data-cod="1.2">
    <p>Every block code starts with the code of its page. That is how the engine knows which sheet
    an event belongs to without having to store the file path.</p>
  </div>

</main>

<!-- The review panel. Order matters: common.js defines window.DOC_FIRST, which the others use.
