<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<!--
  A única página que se vê sem sessão, e por isso ela é AUTOCONTIDA: nada de /front/ds, nada de
  fonte baixada. Se ela importasse o tema, a exceção de autenticação teria de liberar a pasta
  inteira do tema — e "quase tudo fechado" não fecha nada. Aqui a exceção é um arquivo só.
  Mora em review/api/ e não em front/ porque é do MOTOR: quem adota o Doc First troca o front
  inteiro e continua precisando de uma porta de entrada.
-->
<style>
  :root { --tinta: #12263a; --marca: #0883C5; --linha: #d7e2ea; --fundo: #f4f7f9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--fundo);
    color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--linha);
         border-radius: 12px; padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #5b7183; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 16px; /* 16px: menos que isso e o iPhone dá zoom */
    border: 1px solid var(--linha); border-radius: 8px; background: #fff; color: inherit;
  }
  input:focus-visible { outline: 2px solid var(--marca); outline-offset: 1px; border-color: var(--marca); }
  button {
    width: 100%; margin-top: 24px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--marca); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
  #aviso { margin-top: 16px; font-size: 14px; color: #a3231f; min-height: 1.5em; }
  #aviso:empty { margin: 0; min-height: 0; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Entrar</h1>
  <p class="sub" id="sub">Documentação revisável — é preciso se identificar.</p>

  <form id="form" autocomplete="on">
    <div id="campos-entrada">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    </div>

    <div id="campos-troca" hidden>
      <label for="nova">Nova senha</label>
      <input id="nova" name="nova" type="password" autocomplete="new-password" minlength="12">
      <label for="repete">Repita a nova senha</label>
      <input id="repete" name="repete" type="password" autocomplete="new-password" minlength="12">
    </div>

    <button id="botao" type="submit">Entrar</button>
    <!-- role=alert para o leitor de tela anunciar o erro; sem isso, quem não enxerga a tela
         aperta Entrar de novo sem saber o que houve. -->
    <p id="aviso" role="alert"></p>
  </form>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const avisar = (texto) => { $('aviso').textContent = texto; };
  let trocando = false;

  async function pede(rota, corpo) {
    const r = await fetch(rota, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo),
    });
    let dados = {};
    try { dados = await r.json(); } catch { /* resposta sem corpo: o status já basta */ }
    return { ok: r.ok, dados };
  }

  function pedirTroca() {
    trocando = true;
    $('titulo').textContent = 'Trocar a senha';
    $('sub').textContent = 'Esta ainda é a senha do primeiro acesso. Escolha uma sua, com 12 caracteres ou mais.';
    $('campos-entrada').hidden = true;
    $('campos-troca').hidden = false;
    $('botao').textContent = 'Trocar e continuar';
    $('nova').focus();
  }

  $('form').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    avisar('');
    $('botao').disabled = true;
    try {
      if (!trocando) {
        const { ok, dados } = await pede('/api/entrar', { email: $('email').value, senha: $('senha').value });
        if (!ok) return avisar(dados.erro || 'não foi possível entrar');
        if (dados.precisaTrocarSenha) return pedirTroca();
        return irParaODestino();
      }

      if ($('nova').value !== $('repete').value) return avisar('as duas senhas não são iguais');
      const { ok, dados } = await pede('/api/trocar-senha', { atual: $('senha').value, nova: $('nova').value });
      if (!ok) return avisar(dados.erro || 'não foi possível trocar a senha');
      irParaODestino();
    } catch {
      avisar('o serviço não respondeu');
    } finally {
      $('botao').disabled = false;
    }
  });

  // Volta para a página que a pessoa tentou abrir. Só caminho interno: um `destino` vindo de fora
  // com http://outro-site vira um redirecionamento aberto, que é phishing com o nosso domínio.
  function irParaODestino() {
    const pedido = new URLSearchParams(location.search).get('destino') || '';
    location.href = /^\/[^/\\]/.test(pedido) ? pedido : '/';
  }
</script>
</body>
</html>
